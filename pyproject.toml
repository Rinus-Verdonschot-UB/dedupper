[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dedupper"
version = "0.8.1"
description = "Parsing-first deduplication of scientific article exports"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "pandas>=2.1,<3",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "charset-normalizer>=3.3,<4",
    "rapidfuzz>=3.6,<4",
    "gunicorn>=23,<28",
]

[tool.setuptools]
packages = ["dedupper"]
include-package-data = false

[tool.setuptools.package-data]
dedupper = ["templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
