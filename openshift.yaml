apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dedupper-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dedupper
  labels:
    app: dedupper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dedupper
  template:
    metadata:
      labels:
        app: dedupper
    spec:
      containers:
        - name: dedupper
          # Replace this with the image produced by your DSRI build.
          image: REPLACE_WITH_YOUR_DEDUPPER_IMAGE
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DEDUPPER_JOB_ROOT
              value: /data/jobs
            - name: DEDUPPER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dedupper-secret
                  key: secret-key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dedupper-data
---
apiVersion: v1
kind: Service
metadata:
  name: dedupper
  labels:
    app: dedupper
spec:
  selector:
    app: dedupper
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dedupper
spec:
  to:
    kind: Service
    name: dedupper
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
